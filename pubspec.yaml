name: shorts_splitter
description: "Production-ready YouTube Shorts video splitter application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # UI / Cupertino icons
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # FFmpeg Processing (Actively maintained fork)
  ffmpeg_kit_flutter_new: ^4.6.8

  # File / Video Picking & Permissions
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  permission_handler: ^11.4.0

  # Storage & Directories
  shared_preferences: ^2.3.5
  path: ^1.9.1
  path_provider: ^2.1.5

  # Video Preview
  video_player: ^2.9.2

  # Utilities & Sharing
  intl: ^0.20.2
  share_plus: ^10.1.4
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.5
  build_runner: ^2.4.15
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
