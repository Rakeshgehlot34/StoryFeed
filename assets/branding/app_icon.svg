<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B2E" />
      <stop offset="100%" stop-color="#110E1C" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C4DFF" />
      <stop offset="100%" stop-color="#651FFF" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Film Card Border -->
  <rect x="76" y="76" width="360" height="360" rx="48" fill="none" stroke="#373052" stroke-width="6" opacity="0.6" />

  <!-- Film Slices & Playhead Silhouette -->
  <!-- Left Segment -->
  <path d="M 140 136 C 140 122.7 150.7 112 164 112 L 216 112 C 220.4 112 224 115.6 224 120 L 224 392 C 224 396.4 220.4 400 216 400 L 164 400 C 150.7 400 140 389.3 140 376 Z" fill="url(#primaryGrad)" />

  <!-- Middle Slice (Center Action with Play glyph) -->
  <path d="M 240 120 C 240 115.6 243.6 112 248 112 L 348 112 C 352.4 112 356 115.6 356 120 L 356 392 C 356 396.4 352.4 400 348 400 L 248 400 C 243.6 400 240 396.4 240 392 Z" fill="#2A243D" stroke="#453B66" stroke-width="4" />

  <!-- Dynamic Slicing Blade Accent -->
  <path d="M 226 96 L 238 96 L 238 416 L 226 416 Z" fill="url(#accentGrad)" filter="url(#glow)" />

  <!-- Play Triangle Center Piece -->
  <polygon points="280,224 332,256 280,288" fill="url(#accentGrad)" />

  <!-- Film Perforations -->
  <circle cx="164" cy="144" r="8" fill="#FFFFFF" opacity="0.3" />
  <circle cx="164" cy="368" r="8" fill="#FFFFFF" opacity="0.3" />
  <circle cx="332" cy="144" r="8" fill="#FFFFFF" opacity="0.3" />
  <circle cx="332" cy="368" r="8" fill="#FFFFFF" opacity="0.3" />
</svg>

