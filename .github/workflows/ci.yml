name: ShortsSplitter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-check:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Verify Documentation Integrity
        run: ./scripts/docs_check.sh

      - name: Run Static Analyzer
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run Test Suite
        run: flutter test --coverage

      - name: Verify Android Build Assembly
        run: flutter build apk --debug

